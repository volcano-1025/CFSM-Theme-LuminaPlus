name: Build theme

# 源码在 main，构建产物（index.html + assets/）自动发布到 dist 分支。
# 主题安装地址就填 dist 分支：
#   https://github.com/<owner>/<repo>/tree/dist
#
# preview 分支同理，产物发到 dist-preview，用来在后台临时切地址验收，
# 不会动到线上用的 dist。
#
# 产物提交的说明就是主题商店里的「更新日志」和版本下拉的标题，格式是
#   v<package.json 的 version> <更新日志>
# 更新日志默认取本次源码提交的标题；手动触发时可以在 changelog 里另写一句。
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
    inputs:
      changelog:
        description: "更新日志（留空则用最近一次源码提交的标题）"
        required: false
        type: string
      force:
        description: "产物没变化也发布一版（只想改更新日志时用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 连续推送时只保留最后一次构建，避免两个 job 抢着往同一个分支推。
# main 与 preview 各自排队，互不打断。
concurrency:
  group: build-theme-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target branch
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "preview" ]; then
            echo "branch=dist-preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=dist" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 版本号来自 package.json，发布新版本前记得 npm version / 手改一下。
      - name: Compose release note
        id: note
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          # 优先级：手动填的 changelog > CHANGELOG.md 里对应版本的第一行 > 源码提交标题。
          note="${CHANGELOG:-}"
          if [ -z "${note}" ] && [ -f CHANGELOG.md ]; then
            note="$(awk -v want="## ${version}" '
              $0 == want { found = 1; next }
              found && /^## / { exit }
              found && NF { print; exit }
            ' CHANGELOG.md)"
          fi
          [ -n "${note}" ] || note="$(git log -1 --pretty=%s)"
          {
            echo "message<<RELEASE_NOTE_EOF"
            echo "${version} ${note}"
            echo
            echo "build: ${GITHUB_SHA::7}"
            echo "RELEASE_NOTE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次产物说明：${version} ${note}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 主题目录只允许 index.html 和 assets/，构建配置若被改坏要在这里拦下来。
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          test -d dist/assets || { echo "缺少 dist/assets/"; exit 1; }
          unexpected="$(find dist -mindepth 1 -maxdepth 1 ! -name index.html ! -name assets)"
          if [ -n "$unexpected" ]; then
            echo "产物里出现了不允许的顶层文件："
            echo "$unexpected"
            exit 1
          fi

      # 产物分支必须保留历史：主题商店的 versions[].commitid 指向某次构建的 commit，
      # 用户也可能把主题地址锁在 40 位 SHA 上。一旦 force-push 覆盖，这些旧地址就会失效，
      # 所以这里是在已有分支上追加提交，不重建、不强推。
      - name: Publish build
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          RELEASE_NOTE: ${{ steps.note.outputs.message }}
          FORCE_PUBLISH: ${{ inputs.force }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="${RUNNER_TEMP}/publish"

          # 已有产物分支就克隆下来接着提交；第一次发布时该分支还不存在。
          if ! git clone -q --branch "${TARGET_BRANCH}" --single-branch "${remote}" "${workdir}"; then
            echo "${TARGET_BRANCH} 还不存在，创建新分支"
            git init -q -b "${TARGET_BRANCH}" "${workdir}"
            git -C "${workdir}" remote add origin "${remote}"
          fi

          # 换成本次产物：删掉除 .git 外的所有旧文件，再整包拷入。
          find "${workdir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. "${workdir}/"

          cd "${workdir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            if [ "${FORCE_PUBLISH}" != "true" ]; then
              echo "产物与上次一致，跳过发布：$(git rev-parse HEAD)"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 只想给商店补一条更新日志时，用同样的产物再发一版。
            git commit -q --allow-empty -m "${RELEASE_NOTE}"
          else
            # 同一个版本号只能发一次正式版：这一步只看「产物有没有变化」，改了代码忘了改版本号的话，
            # dist 上会多出一条同名提交，而产物分支不能改写，删不掉（v1.2.9、v1.2.13 各有两条）。
            # 依据是 dist 上有没有以「v<版本号> 」开头的提交，不靠标签（发 Release 那一步允许失败）。
            # 只在产物真变了时才拦：只改文档的推送走上面「产物一致，跳过」那条路，不受影响。
            # preview 不拦，同一版本号本来就会验收多轮。
            if [ "${TARGET_BRANCH}" = "dist" ]; then
              version="${RELEASE_NOTE%% *}"
              if git log --format=%s | awk -v want="${version} " 'index($0, want) == 1 { found = 1 } END { exit found ? 0 : 1 }'; then
                echo "::error::${version} 已经发布到 dist 了，而这次的产物和它不一样。先改 package.json 的 version 并在 CHANGELOG.md 加对应的段，再推。"
                exit 1
              fi
            fi
            git commit -q -m "${RELEASE_NOTE}"
          fi
          git push -q origin "HEAD:${TARGET_BRANCH}"
          echo "已发布到 ${TARGET_BRANCH} 分支：${GITHUB_SHA::7}"
          echo "产物 commit（可用于主题商店 versions[].commitid）：$(git rev-parse HEAD)"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 正式版（dist）发一条 GitHub Release，方便别人 Watch → Releases 订阅更新（issue #6 有人要）。
      # 标签打在产物提交上，所以 tree/v<版本号> 就是那一版的主题文件。
      # 标题只写版本号（站长 2026-10-15：仓库首页右侧 Releases 栏带上更新日志会被截断），更新日志第一行放进正文开头。
      # 同一版本号的标签已经在了就跳过（同一版本号推两次 main 时不会覆盖已发的 Release）。
      # 只是通知，不影响任何人的主题怎么更新；这一步失败也不影响上面已经发布好的产物。
      - name: Create GitHub Release
        if: steps.target.outputs.branch == 'dist' && steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "标签 ${version} 已存在，不再发 Release"
            exit 0
          fi
          title="$(awk -v want="## ${version}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found && NF { print; exit }
          ' CHANGELOG.md)"
          notes="${RUNNER_TEMP}/release-notes.md"
          # 正文只列这一版每条的加粗标题（带上 issue 号），细节留在 CHANGELOG（站长 2026-10-15：整段贴进来太长）。
          brief="$(awk -v want="## ${version}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found && /^- \*\*/ {
              line = $0
              sub(/^- \*\*/, "", line)
              end = index(line, "**")
              if (end == 0) next
              head = substr(line, 1, end - 1)
              rest = substr(line, end + 2)
              ref = ""
              if (index(rest, "（") == 1) {
                close_at = index(rest, "）")
                paren = close_at > 0 ? substr(rest, 1, close_at) : ""
                if (match(paren, /#[0-9]+/)) ref = "（" substr(paren, RSTART, RLENGTH) "）"
              }
              print "- " head ref
            }
          ' CHANGELOG.md)"
          {
            if [ -n "${title:-}" ]; then
              echo "${title}"
              echo
            fi
            if [ -n "${brief}" ]; then
              echo "${brief}"
              echo
            fi
            echo "完整说明见 [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
            echo
            echo "锁定这一版的主题地址：\`https://github.com/${GITHUB_REPOSITORY}/tree/${DIST_COMMIT}\`"
          } > "${notes}"
          gh release create "${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${DIST_COMMIT}" \
            --title "${version}" \
            --notes-file "${notes}"
          echo "已发 Release ${version}（标签指向产物 ${DIST_COMMIT::7}）"
